name: PHPUnit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    name: phpunit (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }}, UX ${{ matrix.ux }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            symfony: '7.4.*'
            ux: '^2.0'
          - php-version: '8.5'
            symfony: '8.*'
            ux: '^3.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.symfony }}-

      # composer.lock is not committed, so resolve per matrix entry. Pin the
      # Symfony and UX majors with --with; -W lets everything else follow.
      - name: Install dependencies
        run: >-
          composer update --prefer-dist --no-progress --no-interaction -W
          --with "symfony/framework-bundle:${{ matrix.symfony }}"
          --with "symfony/form:${{ matrix.symfony }}"
          --with "symfony/validator:${{ matrix.symfony }}"
          --with "symfony/ux-live-component:${{ matrix.ux }}"
          --with "symfony/ux-twig-component:${{ matrix.ux }}"
          --with "symfony/ux-icons:${{ matrix.ux }}"

      - name: Run PHPUnit
        run: vendor/bin/phpunit
